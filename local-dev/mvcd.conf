# ============================================
# MVC 本地开发节点配置
# 模式: testnet / 完全离线 / 单机
# 配合同目录下的 start-node.sh 使用
# ============================================

# 链模式: testnet
#   - 允许最低难度块(fPowAllowMinDifficultyBlocks)
#   - 无需 peer 即可挖块(fMiningRequiresPeers=false)
#   - coinbase 成熟期 = 1 块(COINBASE_MATURITY_TESTNET),挖 1 块币即可花费
testnet=1

# RPC 服务(mvc-cli / 钱包客户端访问,仅绑定本机回环地址)
server=1
rpcuser=dev
rpcpassword=dev123

# 完全离线: 不建立任何外部 P2P 连接
noconnect=1
dnsseed=0
listen=0
upnp=0

# 本地开发链
minimumchainwork=0   # 关闭链工作量下限,避免本地链被误判为"未同步"
txindex=1            # 保留全部交易索引,便于按 txid 查询任意交易

# ZMQ 通知(mvc-assets-indexer 依赖,订阅 rawtx / hashblock)
zmqpubrawtx=tcp://0.0.0.0:19000
zmqpubhashblock=tcp://0.0.0.0:19000
